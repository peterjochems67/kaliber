var EXEC='https://script.google.com/macros/s/AKfycbxOLDUvevFTBSp_XJX-pD_5_sFVWn-bL86J6GfBhLvXrKmhKwmXhU9LxzLLK0jo_qib5A/exec';
var BASE=location.href.split('#')[0].split('?')[0].replace(/index\.html$/,'');
var $=function(i){return document.getElementById(i);};
function post(o){return fetch(EXEC,{method:'POST',credentials:'omit',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(o)}).then(function(r){return r.json();});}
/* Ersätter Googles google.script.run: samma anrop, men via vanliga webbanrop till Kalibers motor. */
function shim(EXEC,BASE){
  function rpc(fn,args){return fetch(EXEC,{method:'POST',credentials:'omit',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({rpc:'call',fn:fn,args:args})}).then(function(r){return r.json();});}
  function mk(s,f,u){return new Proxy({},{get:function(_,p){
    if(p==='withSuccessHandler')return function(h){return mk(h,f,u);};
    if(p==='withFailureHandler')return function(h){return mk(s,h,u);};
    if(p==='withUserObject')return function(o){return mk(s,f,o);};
    if(typeof p!=='string')return undefined;
    return function(){var a=Array.prototype.slice.call(arguments);
      rpc(p,a).then(function(r){
        if(r&&r.ok){if(s)s(r.result,u);}
        else{var e=new Error((r&&r.error)||'Okänt fel');if(f)f(e,u);else console.error(e);}
      },function(err){var e=new Error('Kunde inte nå servern. Kontrollera nätverket och försök igen.');if(f)f(e,u);else console.error(e,err);});
    };
  }});}
  window.google={script:{run:mk(null,null,undefined)}};
  try{
    document.addEventListener('click',function(e){var a=e.target&&e.target.closest?e.target.closest('a'):null;if(a&&a.href===BASE){try{sessionStorage.removeItem('kal');}catch(x){}}},true);
  }catch(e){}
}
function show(html){
  var inj='<script>('+shim.toString()+')('+JSON.stringify(EXEC)+','+JSON.stringify(BASE)+');<\/script>';
  html=/<head[^>]*>/i.test(html)?html.replace(/<head[^>]*>/i,function(m){return m+inj;}):inj+html;
  document.open();document.write(html);document.close();
}
function login(o){
  o.rpc='login';o.base=BASE;
  return post(o).then(function(r){
    if(r&&r.ok&&r.html){try{if(r.token&&r.menu)sessionStorage.setItem('kal',JSON.stringify({t:r.token,m:r.menu}));}catch(e){}show(r.html);return true;}
    return r||{ok:false};
  });
}
function fail(msg){$('b').disabled=false;$('b').textContent='Logga in';$('msg').textContent=msg;$('card').style.visibility='visible';}
$('f').addEventListener('submit',function(e){
  e.preventDefault();var u=$('u').value.trim(),p=$('p').value;if(!u||!p){$('msg').textContent='Skriv namn och lösenord.';return;}
  $('b').disabled=true;$('b').textContent='Loggar in…';$('msg').textContent='';
  login({user:u,pw:p}).then(function(r){
    if(r===true)return;
    fail(r&&r.locked?'För många försök. Vänta en stund och försök igen.':(r&&r.error?r.error:'Fel namn eller lösenord.'));
  }).catch(function(){fail('Kunde inte nå Kaliber. Kontrollera nätverket och försök igen.');});
});
$('fl').onclick=function(){$('forgot').style.display='block';this.style.display='none';$('fn').value=$('u').value;};
$('fb').onclick=function(){var n=$('fn').value.trim();if(!n)return;var b=this;b.disabled=true;b.textContent='Skickar…';
  post({rpc:'call',fn:'resetPassword',args:[n]}).then(function(){$('ok').textContent='Om namnet finns har ett nytt lösenord skickats till den sparade mejladressen.';b.style.display='none';})
  .catch(function(){$('ok').textContent='Något gick fel, försök igen.';b.disabled=false;b.textContent='Skicka nytt lösenord';});};
/* Återuppta: byte av meny (?t=&meny=) eller pågående session i den här fliken. */
(function(){
  var q=new URLSearchParams(location.search),t=q.get('t'),m=q.get('meny');
  if(!(t&&m)){try{var s=JSON.parse(sessionStorage.getItem('kal')||'null');if(s&&s.t&&s.m){t=s.t;m=s.m;}}catch(e){}}
  if(t&&m){$('card').style.visibility='hidden';
    login({t:t,meny:m}).then(function(r){if(r!==true){try{sessionStorage.removeItem('kal');}catch(e){}$('card').style.visibility='visible';}})
    .catch(function(){$('card').style.visibility='visible';});}
})();

/* Dagens vits / nytt (hämtas från Kaliber, visas om det går) */
post({rpc:'fun'}).then(function(r){if(r&&r.ok&&r.html)$('fun').innerHTML=r.html;}).catch(function(){});
