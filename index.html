var EXEC='https://script.google.com/macros/s/AKfycbxOLDUvevFTBSp_XJX-pD_5_sFVWn-bL86J6GfBhLvXrKmhKwmXhU9LxzLLK0jo_qib5A/exec';
var BASE=location.href.split('#')[0].split('?')[0].replace(/index\.html$/,'');
var $=function(i){return document.getElementById(i);};
function post(o){return fetch(EXEC,{method:'POST',credentials:'omit',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(o)}).then(function(r){return r.json();});}
/* Ersätter Googles google.script.run: samma anrop, men via vanliga webbanrop till Kalibers motor. */
function shim(EXEC,BASE){
  function rpc(fn,args){return fetch(EXEC,{method:'POST',credentials:'omit',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({rpc:'call',fn:fn,args:args})}).then(function(r){return r.json();});}
  function mk(s,f,u){return new Proxy({},{get:function(_,p){
    if(p==='withSuccessHandler')return function(h){return mk(h,f,u);};
    if(p==='withFailureHandler')return function(h){return mk(s,h,u);};
    if(p==='withUserObject')return function(o){return mk(s,f,o);};
    if(typeof p!=='string')return undefined;
    return function(){var a=Array.prototype.slice.call(arguments);
      rpc(p,a).then(function(r){
        if(r&&r.ok){if(s)s(r.result,u);}
        else{var e=new Error((r&&r.error)||'Okänt fel');if(f)f(e,u);else console.error(e);}
      },function(err){var e=new Error('Kunde inte nå servern. Kontrollera nätverket och försök igen.');if(f)f(e,u);else console.error(e,err);});
    };
  }});}
  window.google={script:{run:mk(null,null,undefined)}};
  function fixTitle(){if(document.title!=='Kaliber')document.title='Kaliber';}
  document.addEventListener('DOMContentLoaded',function(){fixTitle();var t=document.querySelector('title');if(t)new MutationObserver(fixTitle).observe(t,{childList:true,characterData:true,subtree:true});});
  try{
    document.addEventListener('click',function(e){var a=e.target&&e.target.closest?e.target.closest('a'):null;if(a&&a.href===BASE){try{sessionStorage.removeItem('kal');}catch(x){}}},true);
  }catch(e){}
}
function show(html){
  var inj='<meta name="apple-mobile-web-app-title" content="Kaliber"><link rel="apple-touch-icon" href="'+BASE+'apple-touch-icon.png"><link rel="icon" type="image/png" href="'+BASE+'icon-512.png"><script>('+shim.toString()+')('+JSON.stringify(EXEC)+','+JSON.stringify(BASE)+');<\/script>';
  html=/<head[^>]*>/i.test(html)?html.replace(/<head[^>]*>/i,function(m){return m+inj;}):inj+html;
  document.open();document.write(html);document.close();
}
function login(o){
  o.rpc='login';o.base=BASE;
  return post(o).then(function(r){
    if(r&&r.ok&&r.html){try{if(r.token&&r.menu)sessionStorage.setItem('kal',JSON.stringify({t:r.token,m:r.menu}));}catch(e){}
      try{if(o.user&&o.start)localStorage.setItem('kalstart_'+o.user.trim().toLowerCase(),o.start);}catch(e){}
      show(r.html);return true;}
    return r||{ok:false};
  });
}
/* Admin: välj meny efter inloggning. Lösenordet finns bara kvar i den här sidans minne tills en meny är vald. */
function pick(u,p,r){
  var last='';try{last=localStorage.getItem('kalstart_'+u.toLowerCase())||'';}catch(e){}
  var ms=(r.menus||[]).slice();
  ms.sort(function(a,b){return (a.key===last?-2:(a.key===r.def?-1:0))-(b.key===last?-2:(b.key===r.def?-1:0));});
  var h='<div style="font-size:15px;font-weight:600;margin:6px 0 10px">Hej '+String(r.name||u).replace(/</g,'&lt;')+'! Öppna i:</div>';
  ms.forEach(function(m,i){h+='<button type="button" class="pk" data-k="'+String(m.key).replace(/"/g,'&quot;')+'" style="display:block;width:100%;margin-top:8px;padding:11px 14px;font-size:15px;font-weight:'+(i===0?'700':'500')+';text-align:left;border:1px solid #E8E6E0;border-radius:8px;background:'+(i===0?'#1F2430':'#F6F5F1')+';color:'+(i===0?'#fff':'#1F2430')+';cursor:pointer;font-family:inherit">'+String(m.label).replace(/</g,'&lt;')+'</button>';});
  $('f').style.display='none';$('fl').style.display='none';$('forgot').style.display='none';$('msg').textContent='';
  var box=document.createElement('div');box.id='pick';box.style.cssText='text-align:left;max-height:60vh;overflow:auto';box.innerHTML=h;$('f').parentNode.insertBefore(box,$('f'));
  $('card').style.visibility='visible';
  Array.prototype.forEach.call(box.querySelectorAll('.pk'),function(bt){bt.onclick=function(){
    Array.prototype.forEach.call(box.querySelectorAll('.pk'),function(x){x.disabled=true;});bt.textContent='Öppnar…';
    login({user:u,pw:p,start:bt.getAttribute('data-k')}).then(function(r2){if(r2===true)return;box.remove();$('f').style.display='';$('fl').style.display='';fail('Något gick fel, försök igen.');}).catch(function(){box.remove();$('f').style.display='';$('fl').style.display='';fail('Kunde inte nå Kaliber. Kontrollera nätverket och försök igen.');});
  };});
}
function fail(msg){$('b').disabled=false;$('b').textContent='Logga in';$('msg').textContent=msg;$('card').style.visibility='visible';}
$('f').addEventListener('submit',function(e){
  e.preventDefault();var u=$('u').value.trim(),p=$('p').value;if(!u||!p){$('msg').textContent='Skriv namn och lösenord.';return;}
  $('b').disabled=true;$('b').textContent='Loggar in…';$('msg').textContent='';
  login({user:u,pw:p,choose:true}).then(function(r){
    if(r===true)return;
    if(r&&r.ok&&r.choose){pick(u,p,r);return;}
    fail(r&&r.locked?'För många försök. Vänta en stund och försök igen.':(r&&r.error?r.error:'Fel namn eller lösenord.'));
  }).catch(function(){fail('Kunde inte nå Kaliber. Kontrollera nätverket och försök igen.');});
});

(function(){
  var q=new URLSearchParams(location.search),t=q.get('t'),m=q.get('meny');
  if(!(t&&m)){try{var s=JSON.parse(sessionStorage.getItem('kal')||'null');if(s&&s.t&&s.m){t=s.t;m=s.m;}}catch(e){}}
  if(t&&m){$('card').style.visibility='hidden';
    login({t:t,meny:m}).then(function(r){if(r!==true){try{sessionStorage.removeItem('kal');}catch(e){}$('card').style.visibility='visible';}})
    .catch(function(){$('card').style.visibility='visible';});}
})();
